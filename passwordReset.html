<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <link rel="stylesheet" href="passwordReset.css">
</head>
<body>

    <!-- Div Principal -->
    <div class="contenedorPrincipal">




        <!-- Zona izquierda de la pantalla -->
        <div class="izquierda">

            <a href="login.html" class="returnArrow">←    Volver</a>


            <img src="/img/logo_grande.png" class="logo_grande" alt="logogrande">

        </div>


        <!-- zona derecha de la pantalla -->
        <div class="derecha">


            <div class="contenido">

                <div class="encabezado">
                    
                    <img src="img/logo_pequeño2.png" class="logo_pequeño2" alt="logopequeño2">

                    <h1 class="title">Recuperar Contraseña</h1>

                    <p class="desc">Ingresa el email asociado a tu cuenta</p>

                </div>


                <div class="contenidoFormulario">

                    <form action="" class="forgot">

                        <div class="campoCorreo">
                          
                            <input type="email" class="inputCorreo" id="correo" name="correo" required>
                          
                            <label for="correo" class="txtEmail">Email</label>
                            


                        
                        </div>


                        <button type="submit" class="btnSendEmail">Enviar Email</button>

                    </form>

                    
            </div>
        </div>
        </div>










        
    </div>
    
</body>
</html>
